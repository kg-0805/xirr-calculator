spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.ssl.enable: ${MAIL_SSL:true}

app:
  auth:
    users:
      - username: investor
        password-hash: "$2a$10$jO5TJ4iBxnXoKFp9jf6JeuNz2pgf3LdTfepL6R2rtZDDA188kCOya"
      - username: advisor
        password-hash: "$2a$10$jO5TJ4iBxnXoKFp9jf6JeuNz2pgf3LdTfepL6R2rtZDDA188kCOya"
  access-request:
    storage-path: data/access-requests.jsonl
    notify-email: ${ACCESS_REQUEST_NOTIFY_EMAIL:}
  rate-limit:
    enabled: true
    login:
      max-requests: 6
      window-seconds: 60
    access-request:
      max-requests: 4
      window-seconds: 600
    xirr:
      max-requests: 20
      window-seconds: 60
