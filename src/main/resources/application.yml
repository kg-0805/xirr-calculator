spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xirr}
    username: ${DB_USERNAME:xirr}
    password: ${DB_PASSWORD:xirr}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  auth:
    users:
      - username: placeholder
        password-hash: "$2a$10$jO5TJ4iBxnXoKFp9jf6JeuNz2pgf3LdTfepL6R2rtZDDA188kCOya"
  access-request:
    storage-path: data/access-requests.jsonl
    notify-email: ${ACCESS_REQUEST_NOTIFY_EMAIL:}
  rate-limit:
    enabled: true
    login:
      max-requests: 6
      window-seconds: 60
    access-request:
      max-requests: 4
      window-seconds: 600
    xirr:
      max-requests: 20
      window-seconds: 60

brevo:
  api-key: ${BREVO_API_KEY:}
  from-email: ${BREVO_FROM_EMAIL:contact@kartikgupta.in}

server:
  port: ${PORT:8080}
